<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Even Odd Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      width: 280px;
    }
    input {
      width: 90%;
      padding: 8px;
      margin-bottom: 10px;
    }
    button {
      padding: 8px 15px;
      cursor: pointer;
    }
    #result {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="box">
    <h3>Even / Odd Checker</h3>
    <input type="number" id="num" placeholder="Enter a number">
    <br>
    <button onclick="checkNumber()">Check</button>
    <p id="result"></p>
  </div>

  <script>
    function checkNumber() {
      let number = document.getElementById("num").value;
      let result = document.getElementById("result");

      if (number === "") {
        result.innerText = "Please enter a number";
      } else if (number % 2 === 0) {
        result.innerText = "Even Number";
      } else {
        result.innerText = "Odd Number";
      }
    }
  </script>

</body>
</html>
