<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Shop Dashboard ₹</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background:#f4f4f4; }
  .sidebar { width: 220px; background-color: #2c3e50; color: white; height: 100vh; float: left; padding: 20px; box-sizing: border-box; }
  .sidebar h2 { margin-top: 0; }
  .sidebar a { display: block; color: white; text-decoration: none; margin: 10px 0; padding: 10px; border-radius: 5px; cursor: pointer; }
  .sidebar a.active, .sidebar a:hover { background-color: #34495e; }

  .content { margin-left: 240px; padding: 20px; }
  @media(max-width:768px){ .sidebar { width: 100%; height:auto; float:none; } .content { margin-left:0; } .cards { flex-direction: column; } .products { flex-direction: column; } }

  .cards { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 40px; }
  .card { flex: 1 1 200px; background: #ecf0f1; padding: 20px; border-radius: 8px; text-align: center; font-size: 18px; }

  .products { display: flex; gap: 20px; flex-wrap: wrap; }
  .product { width: 200px; background: #fff; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .product img { width: 100%; border-radius: 5px; margin-bottom:10px; }
  .product h3 { margin: 10px 0 5px 0; font-size: 16px; }
  .product p { font-size: 13px; color: #555; margin: 5px 0; min-height:35px; }
  .product .price { color: green; font-weight: bold; margin: 10px 0; }
  .btn { padding: 8px 12px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size:14px; }
  .btn:hover { background-color: #2980b9; }

  #cart { position: fixed; top: 20px; right: 20px; background: #3498db; color: white; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
  #cartItems { display:none; background:#fff; color:#000; padding:15px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.2); position:absolute; right:0; top:40px; min-width:300px; z-index:1000; }
  #cartItems h4{ margin-top:0; }
  #cartItems ul { list-style:none; padding:0; margin:0; }
  #cartItems li { margin:5px 0; display:flex; align-items:center; justify-content:space-between; }
  #cartItems img { width:40px; height:40px; object-fit:cover; margin-right:10px; border-radius:5px; }

  #toast { position:fixed; bottom:20px; right:20px; background:#2ecc71; color:white; padding:10px 15px; border-radius:5px; display:none; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>Admin Panel</h2>
  <a class="active" onclick="showSection('dashboard', this)">Dashboard</a>
  <a onclick="showSection('products', this)">Products</a>
</div>

<div class="content">
  <div id="dashboard">
    <h1>Dashboard (Real-Time ₹)</h1>
    <div class="cards">
      <div class="card" id="userCount">Users: 1</div>
      <div class="card" id="ordersCount">Orders: 0</div>
      <div class="card" id="salesCount">Sales: 0</div>
      <div class="card" id="revenueCount">Revenue: ₹0</div>
    </div>
  </div>

  <div id="products" style="display:none;">
    <h1>Mobile Products</h1>
    <div class="products" id="productList"></div>
  </div>
</div>

<div id="cart" onclick="toggleCart()">Cart: <span id="cartCount">0</span> items
  <div id="cartItems">
    <h4>Cart Items</h4>
    <ul id="cartList"></ul>
    <hr>
    Total: ₹<span id="cartTotal">0.00</span>
  </div>
</div>

<div id="toast"></div>

let cart = [];
let totalUsers = 1;
let dashboardOrders = 0;
let dashboardRevenue = 0;

function renderProducts(){
  let container = document.getElementById('productList');
  container.innerHTML='';
  products.forEach((p,index)=>{
    let div=document.createElement('div');
    div.className='product';
    div.innerHTML=`
      <img src="${p.img}" alt="${p.name}">
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <div class="price">₹${p.price.toLocaleString()}</div>
      <button class="btn" onclick="addToCart(${index})">Add to Cart</button>
    `;
    container.appendChild(div);
  });
}

// Add to cart (manual)
function addToCart(index){
  let product = products[index];
  let existing = cart.find(item=>item.name===product.name);
  if(existing) existing.qty++;
  else cart.push({...product, qty:1});
  updateCartDisplay();
  showToast(product.name + ' added to cart!');
}

// Update cart UI
function updateCartDisplay(){
  document.getElementById('cartCount').innerText=cart.reduce((sum,i)=>sum+i.qty,0);
  let list=document.getElementById('cartList');
  list.innerHTML='';
  let total=0;
  cart.forEach(item=>{
    total+=item.price*item.qty;
    let li=document.createElement('li');
    li.innerHTML=`<div style="display:flex;align-items:center;"><img src="${item.img}" alt="${item.name}">${item.name} x ${item.qty}</div> <span>₹${(item.price*item.qty).toLocaleString()}</span>`;
    list.appendChild(li);
  });
  document.getElementById('cartTotal').innerText=total.toLocaleString();
}

// Dashboard updates (real-time independent)
function updateDashboard(){
  document.getElementById('userCount').innerText=`Users: ${totalUsers}`;
  document.getElementById('ordersCount').innerText=`Orders: ${dashboardOrders}`;
  document.getElementById('salesCount').innerText=`Sales: ${dashboardOrders}`;
  document.getElementById('revenueCount').innerText=`Revenue: ₹${dashboardRevenue.toLocaleString()}`;
}

// Simulate real-time activity
function simulateDashboardActivity(){
  setInterval(()=>{
    let randomProduct = products[Math.floor(Math.random()*products.length)];
    let randomQty = Math.floor(Math.random()*3)+1;
    totalUsers += Math.floor(Math.random()*2);
    dashboardOrders += randomQty;
    dashboardRevenue += randomProduct.price*randomQty;
    updateDashboard();
  }, 5000);
}

function toggleCart(){
  let items=document.getElementById('cartItems');
  items.style.display=items.style.display==='block'?'none':'block';
}

function showSection(section,el){
  ['dashboard','products'].forEach(s=>document.getElementById(s).style.display='none');
  document.getElementById(section).style.display='block';
  document.querySelectorAll('.sidebar a').forEach(a=>a.classList.remove('active'));
  el.classList.add('active');
}

function showToast(msg){
  let toast=document.getElementById('toast');
  toast.innerText=msg;
  toast.style.display='block';
  setTimeout(()=>toast.style.display='none',1500);
}

// Initialize
renderProducts();
updateDashboard();
simulateDashboardActivity();
</script>
